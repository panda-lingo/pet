<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PandaLingo — Solution A: inline SVG pet</title>
    <meta
      name="description"
      content="PandaLingo demo page with a website pet rendered as an inline layered SVG React component."
    />
    <!--
      Brand typography. The display face in the brand book (Canela) is commercial, so the
      nearest open substitute is loaded here and the CSS keeps a full fallback stack: if the
      page is opened offline the layout is unchanged and the serif falls back to Georgia.
      No pet or hero artwork is loaded from the network — all of it is source code.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
