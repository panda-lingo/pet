<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PandaLingo — Solution B: PixiJS pet</title>
    <meta
      name="description"
      content="PandaLingo demo page with a website pet drawn at runtime by PixiJS v8 Graphics — no sprite sheets, no image assets."
    />
    <!--
      Brand typography. The display face in the brand book (Canela) is commercial, so the
      nearest open substitute is loaded here and the CSS keeps a full fallback stack: if the
      page is opened offline the layout is unchanged and the serif falls back to Georgia.
      The pet itself is drawn by PixiJS from source geometry — nothing visual is fetched.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap"
    />
